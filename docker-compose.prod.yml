# Produksi (VPS): hanya Caddy (80/443) yang terbuka ke internet. Database & backend tetap internal.
#   Pertama kali / update:  bash deploy/install.sh   (membuat .env.prod, build, lalu menjalankan semua layanan)
#   Manual:                 docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: hbac
      POSTGRES_USER: hbac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbac -d hbac"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://hbac:${POSTGRES_PASSWORD}@db:5432/hbac
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env.prod}
      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${PUBLIC_URL:?isi PUBLIC_URL di .env.prod}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?isi DEVICE_API_KEY di .env.prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-}
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN:-}
    volumes:
      - hbacdata:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Potongan konfigurasi opsional (mis. password situs) dibuat oleh skrip deploy di folder .caddy/
      - ./.caddy:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  hbacdata:
  caddy_data:
  caddy_config:
